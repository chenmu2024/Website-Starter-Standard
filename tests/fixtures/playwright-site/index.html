<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Standard Browser QA Fixture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; }
    form { display: grid; gap: 12px; }
    input { max-width: 100%; min-width: 0; }
    button, input[type="submit"] { min-height: 40px; }
  </style>
</head>
<body>
  <main data-testid="qa-primary-task">
    <h1>Browser quality fixture</h1>
    <p>This page intentionally includes native and hidden controls.</p>
    <form>
      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" value="12">
      <label><input name="include-tax" type="checkbox" checked> Include tax</label>
      <input type="submit" value="Run calculation">
      <button type="button" aria-label="Open options">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <title>Options icon</title><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" fill="none"/>
        </svg>
      </button>
      <a href="/?details=1">Open details</a>
    </form>
    <div hidden><button>Inactive hidden button without a name</button></div>
    <div aria-hidden="true"><input type="text"></div>
    <div inert><button>Inert menu action</button></div>
    <dialog id="closed-dialog"><button>Closed dialog action</button></dialog>
    <template><button>Template-only action</button></template>
  </main>
</body>
</html>
