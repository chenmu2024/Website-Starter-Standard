name: Website standard regression tests
on:
  push:
    paths:
      - 'tools/seo_audit.py'
      - 'scripts/seo_static_audit.py'
      - 'tests/test_seo_audit.py'
      - 'tests/test_seo_static_audit.py'
      - 'tests/test_calculation_contract.py'
      - 'tools/validate_calculation_cases.py'
      - 'tests/test_deployment_probe.py'
      - 'tests/test_downstream_templates.py'
      - 'templates/**'
      - 'tools/verify_deployment.py'
      - 'tools/validate_export_artifacts.py'
      - 'tools/compile_release_report.py'
      - 'tests/test_export_artifacts.py'
      - 'tests/test_release_report.py'
      - 'tests/test_p1_templates.py'
      - 'requirements-qa.txt'
      - 'INTERNATIONAL-SEO-AUTOMATION.md'
      - 'templates/playwright/**'
      - 'templates/exports/**'
      - 'templates/release-evidence/**'
      - '.github/workflows/seo-audit-tests.yml'
  pull_request:
    paths:
      - 'tools/seo_audit.py'
      - 'scripts/seo_static_audit.py'
      - 'tests/test_seo_audit.py'
      - 'tests/test_seo_static_audit.py'
      - 'tests/test_calculation_contract.py'
      - 'tools/validate_calculation_cases.py'
      - 'tests/test_deployment_probe.py'
      - 'tests/test_downstream_templates.py'
      - 'templates/**'
      - 'tools/verify_deployment.py'
      - '.github/workflows/seo-audit-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional PDF parser for export artifact tests
        run: python -m pip install -r requirements-qa.txt
      - name: Run Python regression suite (validators and template contracts)
        run: python -m unittest discover -s tests -v
