name: SEO audit script tests
on:
  push:
    paths:
      - 'tools/seo_audit.py'
      - 'scripts/seo_static_audit.py'
      - 'tests/test_seo_audit.py'
      - 'tests/test_seo_static_audit.py'
      - 'tests/test_calculation_contract.py'
      - 'tools/validate_calculation_cases.py'
      - 'tests/test_deployment_probe.py'
      - 'tools/verify_deployment.py'
      - '.github/workflows/seo-audit-tests.yml'
  pull_request:
    paths:
      - 'tools/seo_audit.py'
      - 'scripts/seo_static_audit.py'
      - 'tests/test_seo_audit.py'
      - 'tests/test_seo_static_audit.py'
      - 'tests/test_calculation_contract.py'
      - 'tools/validate_calculation_cases.py'
      - 'tests/test_deployment_probe.py'
      - 'tools/verify_deployment.py'
      - '.github/workflows/seo-audit-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full standard-library regression suite
        run: python -m unittest discover -s tests -v
